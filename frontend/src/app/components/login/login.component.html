<app-navbar></app-navbar>
<section class="login-page">
  <div class="login-container">
    <h2>Login</h2>
    <form (submit)="login($event)">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" [value]="username" (input)="username = $any($event.target).value; validateUsername()" required>
        <p *ngIf="usernameError" class="field-error">{{ usernameError }}</p>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" [value]="password" (input)="password = $any($event.target).value; validateUsername()"required>
        <p *ngIf="passwordError" class="field-error">{{ passwordError }}</p>
      </div>
      <button type="submit" [disabled]="!isFormValid()">Login</button>
      <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
    </form>
  </div>
</section>
