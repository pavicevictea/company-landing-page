<section class="login-page">
  <div class="login-container">
    <h2>Admin Login</h2>
    <form (submit)="login($event)">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" [value]="username" (input)="username = $any($event.target).value" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" [value]="password"(input)="password = $any($event.target).value"required>
      </div>
      <button type="submit" [disabled]="!username || !password">Login</button>
      <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
    </form>
  </div>
</section>
