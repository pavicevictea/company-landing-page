<section id="contact">
  <div class="contact-container">
    <div class="contact-intro">
      <h2>Let's Talk</h2>
      <p>Have a project in mind or need help with an existing one? Tell us a little about it and we'll get back to you.</p>
    </div>
    <form class="contact-form" (submit)="showMessage($event)">
      <div class="form-row">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" [value]="name" (input)="onNameInput($event)" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" [value]="email" (input)="onEmailInput($event)" placeholder="Your email" required>
        </div>
      </div>
      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" [value]="subject" (input)="onSubjectInput($event)" placeholder="What is your inquiry about?" required>
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" [value]="message" (input)="onMessageInput($event)" rows="6" placeholder="Tell us about your project..." required></textarea>
      </div>
      <button type="submit" [disabled]="!isFormValid">Send Message</button>
      <p *ngIf="submitted" class="success-message">Your message has been sent successfully.</p>
      <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
    </form>
  </div>
</section>
