<header>
  <nav>
    <a routerLink="/" class="logo">Example Dev</a>
    <ul>
      <li><a (click)="scrollTo('hero')" style="cursor: pointer;">Home</a></li>
      <li><a (click)="scrollTo('services')" style="cursor: pointer;">Services</a></li>
      <li><a (click)="scrollTo('about')" style="cursor: pointer;">About Us</a></li>
      <li><a (click)="scrollTo('contact')" style="cursor: pointer;">Contact</a></li>
    </ul>
    <button *ngIf="!currentUser" type="button" class="btn-auth" (click)="router.navigate(['/login'])">Login</button>
    <button *ngIf="currentUser?.role === 'USER'" type="button" class="btn-auth" (click)="goToDashboard()">Dashboard</button>
    <button *ngIf="currentUser" type="button" class="btn-auth" (click)="logout()">Logout</button>
  </nav>
</header>
